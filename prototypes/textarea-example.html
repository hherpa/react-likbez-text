<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LikbezText - Textarea Example</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <link rel="stylesheet" href="/likbez-text.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; min-height: 100vh; }
    .container { display: flex; height: 100vh; }
    .editor-pane { width: 50%; display: flex; flex-direction: column; border-right: 1px solid #ddd; background: #fff; }
    .editor-pane-header { padding: 16px 20px; background: #fafafa; border-bottom: 1px solid #eee; font-weight: 600; font-size: 14px; }
    .editor-textarea { flex: 1; width: 100%; padding: 20px; border: none; resize: none; font-family: 'Monaco', 'Menlo', monospace; font-size: 14px; line-height: 1.6; }
    .editor-textarea:focus { outline: none; }
    .preview-pane { width: 50%; display: flex; flex-direction: column; background: #fff; }
    .preview-content { flex: 1; padding: 20px; overflow-y: auto; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="importmap">
  {
    "imports": {
      "@siglum/engine": "/node_modules/@siglum/engine/src/index.js",
      "@siglum/filesystem": "/node_modules/@siglum/filesystem/dist/index.js"
    }
  }
  </script>
  <script type="module" src="/siglum-init.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="/worker.js"></script>
  <script src="/busytex.js"></script>
  <script src="/pdftocairo.js"></script>
  <script src="/likbez-text.js" defer></script>

  <script type="text/babel" data-presets="react">
try {
    const { useState } = React;
    const { LikbezText } = LikbezTextLib;

    const DEFAULT_SOURCE = `# Scientific Document

Welcome to **LikbezText**!

## Math

Inline: $E = mc^2$

Display:

$$
x = \\frac{-b \\pm \\sqrt{b^2-4ac}}{2a}
$$

## LaTeX (Siglum)

{siglum}
\\documentclass{article}
\\usepackage{amsmath}
\\begin{document}
\\begin{align}
  \\int_{-\\infty}^{\\infty} e^{-x^2} dx &= \\sqrt{\\pi}
\\end{align}
\\end{document}
{/siglum}
`;

    const App = () => {
      const [source, setSource] = useState(DEFAULT_SOURCE);
      return (
        <div className="container">
          <div className="editor-pane">
            <div className="editor-pane-header">Editor</div>
            <textarea className="editor-textarea" value={source} onChange={e => setSource(e.target.value)} />
          </div>
          <div className="preview-pane">
            <div className="editor-pane-header">Preview</div>
            <div className="preview-content">
              <LikbezText source={source} />
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
} catch(e) {
    console.error('Error:', e.message, e.stack);
}
</script>
</body>
</html>
