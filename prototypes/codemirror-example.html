<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LikbezText - CodeMirror Example</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
  <link rel="stylesheet" href="/likbez-text.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #1e1e1e; color: #e0e0e0; min-height: 100vh; }
    .container { display: flex; height: 100vh; }
    .editor-pane { width: 50%; display: flex; flex-direction: column; border-right: 1px solid #333; background: #1e1e1e; }
    .editor-pane-header { padding: 16px 20px; background: #252525; border-bottom: 1px solid #333; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
    .badge { background: #2196F3; color: white; padding: 2px 8px; border-radius: 4px; font-size: 11px; }
    .codemirror-wrapper { flex: 1; overflow: hidden; }
    .CodeMirror { height: 100%; font-family: 'Fira Code', monospace; font-size: 14px; }
    .preview-pane { width: 50%; display: flex; flex-direction: column; background: #fafafa; }
    .preview-content { flex: 1; padding: 20px; overflow-y: auto; color: #333; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="importmap">
  {
    "imports": {
      "@siglum/engine": "/node_modules/@siglum/engine/src/index.js",
      "@siglum/filesystem": "/node_modules/@siglum/filesystem/dist/index.js"
    }
  }
  </script>
  <script type="module" src="/siglum-init.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="/worker.js"></script>
  <script src="/busytex.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/mode/overlay.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/gfm/gfm.min.js"></script>
  <script src="/likbez-text.js" defer></script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;
    const { LikbezText } = LikbezTextLib;

    const CodeMirrorEditor = ({ value, onChange }) => {
      const ref = useRef(null);
      const cmRef = useRef(null);

      useEffect(() => {
        if (ref.current && !cmRef.current) {
          cmRef.current = CodeMirror.fromTextArea(ref.current, {
            mode: 'gfm',
            theme: 'material-darker',
            lineNumbers: true,
            lineWrapping: true,
          });
          cmRef.current.on('change', cm => onChange(cm.getValue()));
        }
        return () => {
          if (cmRef.current) {
            cmRef.current.toTextArea();
            cmRef.current = null;
          }
        };
      }, []);

      useEffect(() => {
        if (cmRef.current && cmRef.current.getValue() !== value) {
          cmRef.current.setValue(value);
        }
      }, [value]);

      return <div className="codemirror-wrapper"><textarea ref={ref} /></div>;
    };

    const DEFAULT_SOURCE = `# Research Paper

## Math

Inline: $E = mc^2$

Display:

$$
\\nabla \\cdot \\vec{E} = \\frac{\\rho}{\\varepsilon_0}
$$

## LaTeX (Siglum)

{siglum}
\\begin{align}
  \\int_{-\\infty}^{\\infty} e^{-x^2} dx &= \\sqrt{\\pi}
\\end{align}
{/siglum}
`;

    const App = () => {
      const [source, setSource] = useState(DEFAULT_SOURCE);
      return (
        <div className="container">
          <div className="editor-pane">
            <div className="editor-pane-header">
              <span>CodeMirror</span>
              <span className="badge">Markdown + KaTeX + LaTeX</span>
            </div>
            <CodeMirrorEditor value={source} onChange={setSource} />
          </div>
          <div className="preview-pane">
            <div className="editor-pane-header" style={{background:'#fafafa',color:'#333',borderBottom:'1px solid #ddd'}}>Preview</div>
            <div className="preview-content">
              <LikbezText source={source} />
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
