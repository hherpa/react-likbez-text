<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LikbezText Example</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <link rel="stylesheet" href="/likbez-text.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { font-family: system-ui, sans-serif; background: #1e1e1e; color: #e0e0e0; }
    .app { display: flex; height: 100vh; }
    .editor { flex: 1; display: flex; flex-direction: column; }
    .editor textarea { flex: 1; padding: 20px; border: none; resize: none; font-family: monospace; font-size: 14px; line-height: 1.6; background: inherit; color: inherit; }
    .editor textarea:focus { outline: none; }
    .editor-header, .preview-header { padding: 12px 20px; font-weight: 600; font-size: 13px; }
    .preview { flex: 1; display: flex; flex-direction: column; }
    .preview-body { flex: 1; padding: 20px; overflow-y: auto; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "@siglum/engine": "/node_modules/@siglum/engine/src/index.js",
      "@siglum/filesystem": "/node_modules/@siglum/filesystem/dist/index.js"
    }
  }
  </script>

  <script type="module">
    var mod = await import('/node_modules/@siglum/engine/src/index.js');
    window.SiglumCompiler = mod.SiglumCompiler;
    window.dispatchEvent(new Event('siglum-ready'));
  </script>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="/likbez-text.js"></script>

  <script>
    var h = React.createElement;
    var LikbezText = LikbezTextLib.LikbezText;

    var SOURCE = [
      '# LikbezText Demo',
      '',
      '## Math',
      'Inline: $E = mc^2$',
      '',
      '$$\\nabla \\cdot \\vec{E} = \\frac{\\rho}{\\varepsilon_0}$$',
      '',
      '## Table',
      '| Name | Value |',
      '|------|-------|',
      '| Alpha | 1 |',
      '| Beta  | 2 |',
      '',
      '## LaTeX',
      '{siglum}',
      '\\begin{align}',
      '  \\int_{-\\infty}^{\\infty} e^{-x^2} dx &= \\sqrt{\\pi}',
      '\\end{align}',
      '{/siglum}',
    ].join('\n');

    function App() {
      var src = React.useState(SOURCE);
      var rdy = React.useState(!!window.SiglumCompiler);

      React.useEffect(function() {
        if (window.SiglumCompiler) return;
        var go = function() { rdy[1](true); };
        window.addEventListener('siglum-ready', go);
        return function() { window.removeEventListener('siglum-ready', go); };
      }, []);

      if (!rdy[0]) return h('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100vh', color: '#888' } }, 'Loading...');

      return h('div', { className: 'app' },
        h('div', { className: 'editor' },
          h('div', { className: 'editor-header' }, 'Editor'),
          h('textarea', { value: src[0], onChange: function(e) { src[1](e.target.value); }, spellCheck: false })
        ),
        h('div', { className: 'preview' },
          h('div', { className: 'preview-header' }, 'Preview'),
          h('div', { className: 'preview-body' }, h(LikbezText, { source: src[0], theme: 'dark' }))
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(App));
  </script>
</body>
</html>
